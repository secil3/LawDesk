name: LawDesk CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lawdesk
          POSTGRES_PASSWORD: lawdesk_integration_password
          POSTGRES_DB: gys_lawdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawdesk -d gys_lawdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTH_TOKEN_SECRET: test-secret-test-secret-test-secret-test-secret-test-secret-test-secret
      AUTH_TOKEN_TTL_HOURS: 1
      AUTH_COOKIE_NAME: lawdesk_test_session
      INTEGRATION_DATABASE_URL: postgresql://lawdesk:lawdesk_integration_password@127.0.0.1:5432/gys_lawdesk_test
      NODE_ENV: test

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend paketlerini kur
        working-directory: backend
        run: npm ci

      - name: Backend testlerini çalıştır
        working-directory: backend
        run: npm test

      - name: PostgreSQL entegrasyon testlerini çalıştır
        working-directory: backend
        run: npm run test:integration

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend paketlerini kur
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

  production-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Production ortam şablonunu hazırla
        run: |
          cp deploy/production.env.example deploy/production.env
          sed -i 's|^APP_BASE_URL=.*|APP_BASE_URL=https://lawdesk.ci.invalid|' deploy/production.env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-database-password-1234567890|' deploy/production.env
          sed -i 's|^AUTH_TOKEN_SECRET=.*|AUTH_TOKEN_SECRET=ci-auth-secret-ci-auth-secret-ci-auth-secret-ci-auth-secret-ci-auth-secret|' deploy/production.env
          sed -i 's|^SMTP_HOST=.*|SMTP_HOST=smtp.ci.invalid|' deploy/production.env
          sed -i 's|^SMTP_USER=.*|SMTP_USER=lawdesk@ci.invalid|' deploy/production.env
          sed -i 's|^SMTP_PASSWORD=.*|SMTP_PASSWORD=ci-smtp-password-123456|' deploy/production.env
          sed -i 's|^SMTP_FROM=.*|SMTP_FROM=LawDesk CI <lawdesk@ci.invalid>|' deploy/production.env
          sed -i 's|^INITIAL_ADMIN_NAME=.*|INITIAL_ADMIN_NAME=CI Admin|' deploy/production.env
          sed -i 's|^INITIAL_ADMIN_EMAIL=.*|INITIAL_ADMIN_EMAIL=admin@ci.invalid|' deploy/production.env
          sed -i 's|^INITIAL_ADMIN_PASSWORD=.*|INITIAL_ADMIN_PASSWORD=ci-admin-password-123456|' deploy/production.env

      - name: Compose yapılandırmasını doğrula
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          config --quiet

      - name: Production image'larını oluştur
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          build

      - name: Production ayarlarını image içinde doğrula
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          run --rm --no-deps backend node scripts/checkProductionConfig.js

      - name: Production paketini başlat
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          up --detach --wait --wait-timeout 180

      - name: Production health kontrolleri
        run: |
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml ps
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml port frontend 8080
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/api/ready

      - name: Hata durumunda container loglarını göster
        if: failure()
        run: |
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml ps --all
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml logs --no-color --tail=200

      - name: Production test ortamını kapat
        if: always()
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          down --volumes --remove-orphans
