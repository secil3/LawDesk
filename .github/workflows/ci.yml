name: LawDesk CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lawdesk
          POSTGRES_PASSWORD: lawdesk_integration_password
          POSTGRES_DB: gys_lawdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawdesk -d gys_lawdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTH_TOKEN_SECRET: test-secret-test-secret-test-secret-test-secret-test-secret-test-secret
      AUTH_TOKEN_TTL_HOURS: 1
      AUTH_COOKIE_NAME: lawdesk_test_session
      INTEGRATION_DATABASE_URL: postgresql://lawdesk:lawdesk_integration_password@127.0.0.1:5432/gys_lawdesk_test
      NODE_ENV: test

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend paketlerini kur
        working-directory: backend
        run: npm ci

      - name: Backend testlerini çalıştır
        working-directory: backend
        run: npm test

      - name: Backend bağımlılık güvenlik taraması
        working-directory: backend
        run: npm audit --audit-level=high

      - name: PostgreSQL entegrasyon testlerini çalıştır
        working-directory: backend
        run: npm run test:integration

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend paketlerini kur
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Frontend bağımlılık güvenlik taraması
        working-directory: frontend
        run: npm audit --audit-level=high

  browser-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lawdesk
          POSTGRES_PASSWORD: lawdesk_e2e_password
          POSTGRES_DB: gys_lawdesk_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lawdesk -d gys_lawdesk_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailhog:
        image: mailhog/mailhog:v1.0.1
        ports:
          - 1025:1025
          - 8025:8025

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lawdesk:lawdesk_e2e_password@127.0.0.1:5432/gys_lawdesk_e2e_test
      E2E_DATABASE_RESET: "true"
      AUTH_TOKEN_SECRET: e2e-secret-e2e-secret-e2e-secret-e2e-secret-e2e-secret-e2e-secret-e2e-secret
      AUTH_TOKEN_TTL_HOURS: 1
      AUTH_COOKIE_NAME: lawdesk_e2e_session
      APP_BASE_URL: http://127.0.0.1:5175
      REGISTRATION_RATE_LIMIT_MAX: 1000
      SMTP_JSON_TRANSPORT: "false"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      SMTP_FROM: "LawDesk E2E <lawdesk@e2e.test>"
      EMAIL_OUTBOX_POLL_INTERVAL_MS: 1000
      EMAIL_OUTBOX_RETRY_BASE_MS: 1000
      INITIAL_ADMIN_NAME: E2E Admin
      INITIAL_ADMIN_EMAIL: admin.e2e@lawdesk.test
      INITIAL_ADMIN_EMAIL_VERIFIED: "false"
      INITIAL_ADMIN_PASSWORD: E2eAdminParolasi123!
      E2E_ADMIN_EMAIL: admin.e2e@lawdesk.test
      E2E_ADMIN_PASSWORD: E2eAdminParolasi123!
      MAILHOG_API_URL: http://127.0.0.1:8025

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend paketlerini kur
        working-directory: backend
        run: npm ci

      - name: Frontend paketlerini kur
        working-directory: frontend
        run: npm ci

      - name: Chromium ve sistem bağımlılıklarını kur
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E veritabanını hazırla
        working-directory: backend
        run: |
          npm run e2e:reset-db
          npm run create-admin

      - name: Kayıt, aktivasyon ve görev E2E testini çalıştır
        working-directory: frontend
        run: npm run test:e2e

      - name: Başarısız E2E kanıtlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  windows-native-package:
    runs-on: windows-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend paketlerini kur ve Windows testlerini çalıştır
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend paketlerini kur ve Windows build al
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Native Windows kurulum paketini doğrula
        shell: powershell
        run: >-
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass
          -File deploy/windows/Test-LawDeskWindowsPackage.ps1

  production-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Production ortam şablonunu hazırla
        run: |
          cp deploy/production.env.example deploy/production.env
          sed -i 's|^APP_BASE_URL=.*|APP_BASE_URL=https://lawdesk.ci.invalid|' deploy/production.env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-database-password-1234567890|' deploy/production.env
          sed -i 's|^AUTH_TOKEN_SECRET=.*|AUTH_TOKEN_SECRET=ci-auth-secret-ci-auth-secret-ci-auth-secret-ci-auth-secret-ci-auth-secret|' deploy/production.env
          sed -i 's|^SMTP_HOST=.*|SMTP_HOST=smtp.ci.invalid|' deploy/production.env
          sed -i 's|^SMTP_USER=.*|SMTP_USER=lawdesk@ci.invalid|' deploy/production.env
          sed -i 's|^SMTP_PASSWORD=.*|SMTP_PASSWORD=ci-smtp-password-123456|' deploy/production.env
          sed -i 's|^SMTP_FROM=.*|SMTP_FROM=LawDesk CI <lawdesk@ci.invalid>|' deploy/production.env
          sed -i 's|^INITIAL_ADMIN_NAME=.*|INITIAL_ADMIN_NAME=CI Admin|' deploy/production.env
          sed -i 's|^INITIAL_ADMIN_EMAIL=.*|INITIAL_ADMIN_EMAIL=admin@ci.invalid|' deploy/production.env
          sed -i 's|^INITIAL_ADMIN_PASSWORD=.*|INITIAL_ADMIN_PASSWORD=ci-admin-password-123456|' deploy/production.env

      - name: Compose yapılandırmasını doğrula
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          config --quiet

      - name: Production image'larını oluştur
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          build

      - name: Production ayarlarını image içinde doğrula
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          run --rm --no-deps backend node scripts/checkProductionConfig.js

      - name: Production paketini başlat
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          up --detach --wait --wait-timeout 180

      - name: Production health kontrolleri
        run: |
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml ps
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml port frontend 8080
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/api/health
          curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/api/ready

      - name: Hata durumunda container loglarını göster
        if: failure()
        run: |
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml ps --all
          docker compose --profile bundled-db --env-file deploy/production.env --file compose.production.yml logs --no-color --tail=200

      - name: Production test ortamını kapat
        if: always()
        run: >-
          docker compose
          --profile bundled-db
          --env-file deploy/production.env
          --file compose.production.yml
          down --volumes --remove-orphans
