name: LawDesk CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      AUTH_TOKEN_SECRET: test-secret-test-secret-test-secret-test-secret-test-secret-test-secret
      AUTH_TOKEN_TTL_HOURS: 1
      AUTH_COOKIE_NAME: lawdesk_test_session
      NODE_ENV: test

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend paketlerini kur
        working-directory: backend
        run: npm ci

      - name: Backend testlerini çalıştır
        working-directory: backend
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend paketlerini kur
        working-directory: frontend
        run: npm ci

      - name: Frontend production build
        working-directory: frontend
        run: npm run build